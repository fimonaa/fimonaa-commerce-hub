name: Fimonaa Commerce Hub CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  api-checks:
    name: API Build, Lint and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm --workspace apps/api run build

      - name: Lint API
        run: npm --workspace apps/api run lint

      - name: Run API tests
        run: npm --workspace apps/api run test -- --runInBand
