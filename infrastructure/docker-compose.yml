services:
  postgres:
    image: postgres:16-alpine
    container_name: fimonaa-commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fimonaa_commerce
      POSTGRES_USER: fimonaa
      POSTGRES_PASSWORD: local_dev_change_me
    ports:
      - "5432:5432"
    volumes:
      - fimonaa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fimonaa -d fimonaa_commerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fimonaa-commerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fimonaa_redis_data:/data

volumes:
  fimonaa_postgres_data:
  fimonaa_redis_data:
